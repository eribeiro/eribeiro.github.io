papers:
  - id: lamport-time-clocks-1978
    title: Time, Clocks, and the Ordering of Events in a Distributed System
    year: 1978
    authors:
      - Leslie Lamport
    venue: Communications of the ACM
    areas:
      - Distributed Systems
    tags:
      - logical clocks
      - causality
      - ordering
    type: foundational
    lineages:
      - logical-time-consensus
    why_read: Shows that in a distributed system with no shared clock, you can still define a consistent 'happens-before' partial order using logical clocks — the foundation nearly every later consistency and consensus protocol builds on.
    difficulty: advanced
    reading_time_minutes: 120
    links: {}
    predecessors: []
    successors: []
  - id: transaction-concept-1981
    title: 'The Transaction Concept: Virtues and Limitations'
    year: 1981
    authors:
      - Jim Gray
    venue: VLDB
    areas:
      - Databases
    tags:
      - transactions
      - ACID
      - concurrency
    type: foundational
    lineages:
      - transactions-recovery
    why_read: Jim Gray's early statement of what a transaction actually guarantees (atomicity, durability, and what would later be codified as ACID) and where the abstraction breaks down for long-running or nested work.
    difficulty: advanced
    reading_time_minutes: 120
    links: {}
    predecessors: []
    successors: []
  - id: byzantine-generals-1982
    title: The Byzantine Generals Problem
    year: 1982
    authors:
      - Leslie Lamport
      - Robert Shostak
      - Marshall Pease
    venue: ACM TOPLAS
    areas:
      - Distributed Systems
    tags:
      - BFT
      - fault tolerance
      - consensus
    type: foundational
    lineages:
      - fault-tolerance-bft
    why_read: Formalizes reaching agreement when some participants may lie or act arbitrarily rather than just fail silently, and proves how many honest participants are needed to tolerate a given number of traitors.
    difficulty: advanced
    reading_time_minutes: 120
    links: {}
    predecessors: []
    successors: []
  - id: end-to-end-1984
    title: End-to-End Arguments in System Design
    year: 1984
    authors:
      - Jerome H. Saltzer
      - David P. Reed
      - David D. Clark
    venue: ACM TOCS
    areas:
      - Distributed Systems
      - Infrastructure
    tags:
      - end-to-end principle
      - System design
    type: foundational
    lineages:
      - systems-design-principles
    why_read: Argues that correctness-critical functions like reliable delivery should live at the endpoints of a system, not be pushed into lower layers that can't fully guarantee them — a principle that shaped the Internet's own design.
    difficulty: advanced
    reading_time_minutes: 120
    links: {}
    predecessors: []
    successors: []
  - id: flp-1985
    title: Impossibility of Distributed Consensus with One Faulty Process
    year: 1985
    authors:
      - Michael J. Fischer
      - Nancy A. Lynch
      - Michael S. Paterson
    venue: JACM
    areas:
      - Distributed Systems
    tags:
      - consensus
      - impossibility
      - asynchrony
    type: foundational
    lineages:
      - logical-time-consensus
    why_read: Proves no fully asynchronous consensus protocol can guarantee both safety and termination if even one process might fail — the impossibility result every practical protocol like Paxos or Raft has to work around.
    difficulty: advanced
    reading_time_minutes: 120
    links: {}
    predecessors: []
    successors: []
  - id: viewstamped-1988
    title: 'Viewstamped Replication: A New Primary Copy Method to Support Highly-Available Distributed Systems'
    year: 1988
    authors:
      - Brian M. Oki
      - Barbara Liskov
    venue: PODC
    areas:
      - Distributed Systems
    tags:
      - replication
      - consensus
      - primary-backup
    type: classic
    lineages:
      - consensus-replication
    why_read: One of the earliest primary-backup replication protocols with automatic view changes on primary failure — predates Paxos-based replicated state machines but solves essentially the same problem.
    difficulty: intermediate
    reading_time_minutes: 90
    links: {}
    predecessors: []
    successors: []
  - id: aries-1992
    title: 'ARIES: A Transaction Recovery Method Supporting Fine-Granularity Locking and Partial Rollbacks Using Write-Ahead Logging'
    year: 1992
    authors:
      - C. Mohan
      - Don Haderle
      - Bruce Lindsay
      - Hamid Pirahesh
      - Peter Schwarz
    venue: ACM TODS
    areas:
      - Databases
    tags:
      - recovery
      - WAL
      - logging
    type: essential
    lineages:
      - transactions-recovery
    why_read: Introduces write-ahead logging with LSNs, physiological logging, and fuzzy checkpointing — the recovery algorithm underlying most commercial databases' crash recovery to this day.
    difficulty: intermediate
    reading_time_minutes: 90
    links: {}
    predecessors: []
    successors: []
  - id: volcano-1994
    title: Volcano—An Extensible and Parallel Query Evaluation System
    year: 1994
    authors:
      - Goetz Graefe
    venue: IEEE TKDE
    areas:
      - Databases
      - Data management
    tags:
      - query execution
      - iterator model
      - parallelism
    type: essential
    lineages:
      - query-execution
    why_read: Introduces the iterator (open-next-close) model where every operator implements the same pull-based interface, letting query plans compose arbitrarily and parallelize by inserting exchange operators — the execution model most DBMSs still use.
    difficulty: intermediate
    reading_time_minutes: 90
    links: {}
    predecessors: []
    successors: []
  - id: ansi-isolation-1995
    title: A Critique of ANSI SQL Isolation Levels
    year: 1995
    authors:
      - Hal Berenson
      - Phil Bernstein
      - Jim Gray
      - Jim Melton
      - Elizabeth O'Neil
      - Patrick O'Neil
    venue: SIGMOD
    areas:
      - Databases
    tags:
      - isolation
      - transactions
      - anomalies
    type: essential
    lineages:
      - isolation-concurrency
    why_read: Shows the ANSI SQL isolation-level definitions, based on forbidding specific phenomena, are ambiguous and don't characterize what commercial databases actually implement — motivating later serializability-graph-based definitions.
    difficulty: intermediate
    reading_time_minutes: 90
    links: {}
    predecessors: []
    successors: []
  - id: lsm-1996
    title: The Log-Structured Merge-Tree (LSM-Tree)
    year: 1996
    authors:
      - Patrick O'Neil
      - Edward Cheng
      - Dieter Gawlick
      - Elizabeth O'Neil
    venue: Acta Informatica
    areas:
      - Databases
      - Data management
    tags:
      - LSM
      - storage engine
      - indexing
    type: essential
    lineages:
      - storage-engines
    why_read: Introduces the LSM-tree, batching random writes into sequential log merges to trade read amplification for write throughput — the storage structure underneath nearly every modern NoSQL and time-series database.
    difficulty: intermediate
    reading_time_minutes: 90
    links: {}
    predecessors: []
    successors: []
  - id: paxos-1998
    title: The Part-Time Parliament
    year: 1998
    authors:
      - Leslie Lamport
    venue: ACM TOCS
    areas:
      - Distributed Systems
    tags:
      - Paxos
      - consensus
      - replication
    type: foundational
    lineages:
      - consensus-replication
    why_read: Introduces Paxos via a parliamentary allegory — a group of processes agreeing on a single value despite lost messages and participants coming and going, using overlapping majority quorums.
    difficulty: advanced
    reading_time_minutes: 120
    links: {}
    predecessors: []
    successors:
      - chubby-2006
  - id: adya-2000
    title: Generalized Isolation Level Definitions
    year: 2000
    authors:
      - Atul Adya
      - Barbara Liskov
      - Patrick O'Neil
    venue: ICDE
    areas:
      - Databases
    tags:
      - isolation
      - transactions
      - serialization
    type: classic
    lineages:
      - isolation-concurrency
    why_read: Replaces ANSI SQL's informal, phenomenon-based isolation definitions with precise ones based on dependency graphs, finally giving snapshot isolation and other multiversion levels a rigorous specification.
    difficulty: intermediate
    reading_time_minutes: 90
    links: {}
    predecessors: []
    successors: []
  - id: swim-2002
    title: 'SWIM: Scalable Weakly-consistent Infection-style Process Group Membership Protocol'
    year: 2002
    authors:
      - Abhinandan Das
      - Indranil Gupta
      - Ashish Motivala
    venue: DSN
    areas:
      - Distributed Systems
      - Infrastructure
    tags:
      - membership
      - gossip
      - failure detection
    type: essential
    lineages:
      - membership-gossip
    why_read: A gossip-based failure detector that decouples detection speed from cluster size using randomized indirect probing, keeping per-node message load constant as the cluster grows.
    difficulty: intermediate
    reading_time_minutes: 90
    links: {}
    predecessors: []
    successors: []
  - id: kelips-2003
    title: 'Kelips: Building an Efficient and Stable P2P DHT Through Increased Memory and Background Overhead'
    year: 2003
    authors:
      - Indranil Gupta
      - Ken Birman
      - Prakash Linga
      - Al Demers
      - Robbert van Renesse
    venue: IPTPS
    areas:
      - Distributed Systems
    tags:
      - DHT
      - P2P
      - gossip
    type: classic
    lineages:
      - membership-gossip
    why_read: A DHT that trades some memory for O(1) lookups by replicating routing state via gossip, instead of the O(log n) hops typical of Chord-style rings.
    difficulty: intermediate
    reading_time_minutes: 90
    links: {}
    predecessors: []
    successors: []
  - id: gfs-2003
    title: The Google File System
    year: 2003
    authors:
      - Sanjay Ghemawat
      - Howard Gobioff
      - Shun-Tak Leung
    venue: SOSP
    areas:
      - Distributed Systems
      - Infrastructure
      - Data management
    tags:
      - storage
      - replication
      - fault tolerance
      - Google
    type: essential
    lineages:
      - distributed-storage
    why_read: A chunk-based distributed file system for huge, append-mostly files, built around a single metadata master and relaxed consistency — the storage layer that made MapReduce and Bigtable possible.
    difficulty: intermediate
    reading_time_minutes: 90
    links: {}
    predecessors: []
    successors: []
  - id: chain-replication-2004
    title: Chain Replication for Supporting High Throughput and Availability
    year: 2004
    authors:
      - Robbert van Renesse
      - Fred B. Schneider
    venue: OSDI
    areas:
      - Distributed Systems
      - Databases
    tags:
      - replication
      - availability
      - throughput
    type: classic
    lineages:
      - consensus-replication
    why_read: Replicates by chaining nodes so writes flow head-to-tail and reads hit the tail, giving strong consistency with throughput that scales independently of failure tolerance, unlike quorum-based schemes.
    difficulty: intermediate
    reading_time_minutes: 90
    links: {}
    predecessors: []
    successors: []
  - id: mapreduce-2004
    title: 'MapReduce: Simplified Data Processing on Large Clusters'
    year: 2004
    authors:
      - Jeffrey Dean
      - Sanjay Ghemawat
    venue: OSDI
    areas:
      - Data management
      - Distributed Systems
      - Infrastructure
    tags:
      - batch processing
      - Google
      - Data parallelism
    type: essential
    lineages:
      - batch-to-Dataflow
    why_read: A two-function programming model (map/reduce) plus a runtime that handles partitioning, scheduling, and failure recovery automatically — the paper that made batch processing over thousands of commodity machines routine.
    difficulty: intermediate
    reading_time_minutes: 90
    links: {}
    predecessors: []
    successors: []
  - id: cstore-2005
    title: 'C-Store: A Column-oriented DBMS'
    year: 2005
    authors:
      - Michael Stonebraker
      - Daniel Abadi
      - Adam Batkin
      - Xuedong Chen
      - Mitch Cherniack
      - Miguel Ferreira
      - Edmond Lau
      - Amerson Lin
      - Sam Madden
      - Elizabeth O'Neil
      - Patrick O'Neil
      - Alex Rasin
      - Nga Tran
      - Stan Zdonik
    venue: VLDB
    areas:
      - Databases
      - Data management
    tags:
      - column store
      - OLAP
      - compression
    type: essential
    lineages:
      - analytical-Databases
    why_read: A column-oriented DBMS built from scratch for read-heavy analytics, with column-specific compression, multiple overlapping sort orders, and a write-optimized store merged in the background — the direct research ancestor of Vertica.
    difficulty: intermediate
    reading_time_minutes: 90
    links: {}
    predecessors: []
    successors: []
  - id: x100-2005
    title: 'MonetDB/X100: Hyper-Pipelining Query Execution'
    year: 2005
    authors:
      - Peter Boncz
      - Marcin Zukowski
      - Niels Nes
    venue: CIDR
    areas:
      - Databases
      - Data management
    tags:
      - vectorized execution
      - CPU
      - cache
    type: essential
    lineages:
      - query-execution
    why_read: Shows that processing data in small vectorized batches instead of tuple-at-a-time avoids the interpretation overhead of Volcano-style iterators and keeps data in CPU cache, delivering order-of-magnitude speedups.
    difficulty: intermediate
    reading_time_minutes: 90
    links: {}
    predecessors: []
    successors: []
  - id: bigtable-2006
    title: 'Bigtable: A Distributed Storage System for Structured Data'
    year: 2006
    authors:
      - Fay Chang
      - Jeffrey Dean
      - Sanjay Ghemawat
      - Wilson C. Hsieh
      - Deborah A. Wallach
      - Mike Burrows
      - Tushar Chandra
      - Andrew Fikes
      - Robert E. Gruber
    venue: OSDI
    areas:
      - Databases
      - Distributed Systems
      - Data management
    tags:
      - wide-column
      - storage
      - Google
    type: essential
    lineages:
      - distributed-storage
    why_read: A sparse, distributed, sorted multi-dimensional map (row, column family, timestamp) built on GFS and Chubby, giving Google one wide-column store for workloads from crawled pages to real-time serving.
    difficulty: intermediate
    reading_time_minutes: 90
    links: {}
    predecessors: []
    successors: []
  - id: ceph-2006
    title: 'Ceph: A Scalable, High-Performance Distributed File System'
    year: 2006
    authors:
      - Sage A. Weil
      - Scott A. Brandt
      - Ethan L. Miller
      - Darrell D. E. Long
      - Carlos Maltzahn
    venue: OSDI
    areas:
      - Distributed Systems
      - Infrastructure
      - Data management
    tags:
      - storage
      - file System
      - CRUSH
    type: essential
    lineages:
      - distributed-storage
    why_read: Uses the CRUSH algorithm to let clients compute data placement instead of looking it up, removing a central directory bottleneck while still surviving failures and rebalancing automatically.
    difficulty: intermediate
    reading_time_minutes: 90
    links: {}
    predecessors: []
    successors: []
  - id: chubby-2006
    title: The Chubby Lock Service for Loosely-Coupled Distributed Systems
    year: 2006
    authors:
      - Mike Burrows
    venue: OSDI
    areas:
      - Distributed Systems
      - Infrastructure
    tags:
      - coordination
      - locking
      - leader election
      - Paxos
      - Google
    lineages:
      - coordination-services
      - consensus-replication
    type: essential
    why_read: Shows why it's useful to encapsulate consensus in a high-level coordination service used by other systems like GFS and Bigtable.
    difficulty: intermediate
    reading_time_minutes: 80
    links:
      paper: https://static.usenix.org/events/osdi06/tech/burrows.html
    predecessors:
      - paxos-1998
    successors:
      - zookeeper-2010
  - id: architecture-db-2007
    title: Architecture of a Database System
    year: 2007
    authors:
      - Joseph M. Hellerstein
      - Michael Stonebraker
      - James Hamilton
    venue: Foundations and Trends in Databases
    areas:
      - Databases
      - Data management
    tags:
      - DBMS architecture
      - query processing
      - storage
    type: essential
    lineages:
      - database-architecture
    why_read: A survey-style tour of how a DBMS is actually built end to end — process models, storage, buffer management, concurrency control, and query processing — connecting decades of research into one coherent picture.
    difficulty: intermediate
    reading_time_minutes: 90
    links: {}
    predecessors: []
    successors: []
  - id: dynamo-2007
    title: 'Dynamo: Amazon''s Highly Available Key-value Store'
    year: 2007
    authors:
      - Giuseppe DeCandia
      - Deniz Hastorun
      - Madan Jampani
      - Gunavardhan Kakulapati
      - Avinash Lakshman
      - Alex Pilchin
      - Swaminathan Sivasubramanian
      - Peter Vosshall
      - Werner Vogels
    venue: SOSP
    areas:
      - Databases
      - Distributed Systems
    tags:
      - key-value
      - eventual consistency
      - consistent hashing
      - Amazon
    type: essential
    lineages:
      - dynamo-family
      - distributed-storage
      - membership-gossip
    why_read: The seminal paper on Dynamo's architecture — consistent hashing, sloppy quorums, vector clocks, gossip, and availability as an explicit design priority.
    difficulty: intermediate
    reading_time_minutes: 90
    links:
      paper: https://dl.acm.org/doi/10.1145/1323293.1294281
    predecessors: []
    successors:
      - dynamodb-2022
      - dynamodb-transactions-2023
  - id: paxos-made-live-2007
    title: 'Paxos Made Live: An Engineering Perspective'
    year: 2007
    authors:
      - Tushar D. Chandra
      - Robert Griesemer
      - Joshua Redstone
    venue: PODC
    areas:
      - Distributed Systems
      - Infrastructure
    tags:
      - Paxos
      - production
      - fault tolerance
    type: classic
    lineages:
      - consensus-replication
    why_read: A frank account of everything the original Paxos paper leaves out — disk corruption, group membership changes, making the algorithm fast enough for production — showing consensus theory and consensus engineering aren't the same thing.
    difficulty: intermediate
    reading_time_minutes: 90
    links: {}
    predecessors: []
    successors: []
  - id: end-architectural-era-2007
    title: The End of an Architectural Era (It's Time for a Complete Rewrite)
    year: 2007
    authors:
      - Michael Stonebraker
      - Samuel Madden
      - Daniel Abadi
      - Stavros Harizopoulos
      - Nabil Hachem
      - Pat Helland
    venue: VLDB
    areas:
      - Databases
    tags:
      - OLTP
      - shared-nothing
      - H-Store
    type: classic
    lineages:
      - oltp-architecture
    why_read: Argues with benchmark evidence that no single RDBMS architecture can be fast at everything, and sketches H-Store, a from-scratch, partitioned, in-memory OLTP design, as the alternative to retrofitting legacy code.
    difficulty: intermediate
    reading_time_minutes: 90
    links: {}
    predecessors: []
    successors: []
  - id: cassandra-2010
    title: 'Cassandra: A Decentralized Structured Storage System'
    year: 2010
    authors:
      - Avinash Lakshman
      - Prashant Malik
