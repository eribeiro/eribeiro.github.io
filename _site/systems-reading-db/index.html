<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Systems Reading Map</title>
  <meta name="description" content="Mapa interativo de papers, researchers e venues em sistemas distribuídos, bancos de dados, data management, infraestrutura e AI systems.">
  <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"> -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div>
    <h1>Paper Club @ UnB</h1>
    <p>Papers, researchers, venues e tracks de leitura em systems.</p>
    <p>Created by Edward Ribeiro</p>    
  </div>
</header>
<main>
<section class="controls" aria-label="Filtros">
  <input id="search" type="search" placeholder="Buscar título, autor, tag, venue..." autocomplete="off">
  <div id="areaFilters" class="chips" aria-label="Áreas"></div>

  <div class="select-row">
    <label>Ano<select id="year"><option value="">All</option></select></label>
    <label>Decade<select id="decade"><option value="">All</option></select></label>
    <label>Era<select id="era"><option value="">All</option></select></label>
    <label>Track<select id="lineage"><option value="">All</option></select></label>
    <label>Venue<select id="venue"><option value="">All</option></select></label>
    <label>Level<select id="difficulty">
      <option value="">All</option><option value="introductory">Introductory</option>
      <option value="intermediate">Intermediate</option><option value="advanced">Advanced</option>
    </select></label>
    <label>Tag<select id="tag"><option value="">All</option></select></label>
    <label>Sorting
      <select id="grouping">
        <option value="year">Group by year</option>
        <option value="decade">Group by decade</option>
        <option value="none">No grouping</option>
      </select>
    </label>
  </div>

  <div class="view-row">
    <nav class="tabs" aria-label="Tipo de conteúdo">
      <button class="tab active" data-view="papers">Papers</button>
      <button class="tab" data-view="researchers">Researchers</button>
      <button class="tab" data-view="venues">Venues</button>
      <button class="tab" data-view="lineages">Tracks</button>
    </nav>
    <button id="clearFilters" class="secondary">Limpar filtros</button>
  </div>
</section>

<section class="summary"><strong id="resultCount">Carregando…</strong><span id="activeSummary"></span></section>
<section id="results" class="results" aria-live="polite"></section>
</main>
<footer>Dados mantidos em YAML e carregados estaticamente no navegador.</footer>
<script src="vendor/js-yaml.min.js"></script>
<script src="app.js"></script>
</body>
</html>
