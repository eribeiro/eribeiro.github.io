<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 921 560" width="921" height="560" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#1a1a1a">
  <title>DVVS timeline with four clients and three replicas: concurrent PUTs survive as siblings; replica B learns Alice Smith, then a stale client PUT at B creates a genuine sibling</title>
  <defs>
    <marker id="tl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <marker id="ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
    <marker id="cl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- phase captions and divider -->
  <text x="300" y="16" font-size="11" fill="#888" text-anchor="middle">steps 1–3</text>
  <text x="700" y="16" font-size="11" fill="#888" text-anchor="middle">steps 4–6</text>
  <line x1="505" y1="24" x2="505" y2="530" stroke="#ccc" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- client timelines -->
  <g stroke="#1565c0" stroke-width="1.2" marker-end="url(#ctl)">
    <line x1="100" y1="50" x2="896" y2="50"/>
    <line x1="100" y1="110" x2="896" y2="110"/>
    <line x1="100" y1="500" x2="896" y2="500"/>
    <line x1="100" y1="440" x2="896" y2="440"/>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="end" fill="#1565c0">
    <text x="90" y="56">Client 1</text>
    <text x="90" y="116">Client 2</text>
    <text x="90" y="506">Client 4</text>
    <text x="90" y="446">Client 3</text>
  </g>

  <!-- replica timelines -->
  <line x1="100" y1="190" x2="896" y2="190" stroke="#777" stroke-width="1.6" marker-end="url(#tl)"/>
  <line x1="100" y1="280" x2="896" y2="280" stroke="#777" stroke-width="1.6" marker-end="url(#tl)"/>
  <line x1="100" y1="370" x2="896" y2="370" stroke="#777" stroke-width="1.6" marker-end="url(#tl)"/>
  <text x="90" y="196" font-size="16" font-weight="bold" text-anchor="end">Replica A</text>
  <text x="90" y="286" font-size="16" font-weight="bold" text-anchor="end">Replica B</text>
  <text x="90" y="376" font-size="16" font-weight="bold" text-anchor="end">Replica C</text>

  <!-- client requests -->
  <g stroke="#1565c0" stroke-width="1.5">
    <line x1="114" y1="50" x2="123" y2="182" marker-end="url(#cl)"/>  <!-- (1) Client 1 PUT at A -->
    <line x1="240" y1="110" x2="249" y2="272" marker-end="url(#cl)"/> <!-- (2) Client 2 PUT at B -->
    <line x1="520" y1="370" x2="533" y2="432" marker-end="url(#cl)"/> <!-- (4) GET reply from C -->
    <line x1="560" y1="440" x2="587" y2="378" marker-end="url(#cl)"/> <!-- (4) Client 3 PUT at C -->
    <line x1="470" y1="190" x2="484" y2="492" marker-end="url(#cl)"/> <!-- GET reply from A to Client 4 -->
    <line x1="840" y1="500" x2="849" y2="288" marker-end="url(#cl)"/> <!-- (6) Client 4 PUT at B -->
  </g>
  <g fill="#1565c0">
    <circle cx="114" cy="50" r="4"/>
    <circle cx="240" cy="110" r="4"/>
    <circle cx="534" cy="440" r="4"/>
    <circle cx="560" cy="440" r="4"/>
    <circle cx="485" cy="500" r="4"/>
    <circle cx="840" cy="500" r="4"/>
  </g>
  <g font-size="12" font-style="italic" fill="#1565c0">
    <text x="126" y="44">PUT Alice, ctx [0,0,0]</text>
    <text x="252" y="104">PUT Alicia, ctx [0,0,0]</text>
    <text x="520" y="462">GET: {Alice, Alicia}, ctx [1,1,0]</text>
    <text x="440" y="522">GET: {Alice, Alicia}, ctx [1,1,0]</text>
    <text x="700" y="522">PUT Alice Johnson, ctx [1,1,0]</text>
  </g>

  <!-- steps 1-3 -->
  <line x1="328" y1="276" x2="337" y2="198" stroke="#777" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#gray)"/>
  <line x1="356" y1="196" x2="441" y2="363" stroke="#777" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#gray)"/>
  <circle cx="124" cy="190" r="6"/>
  <circle cx="338" cy="190" r="6"/>
  <circle cx="250" cy="280" r="6"/>
  <circle cx="337" cy="280" r="6"/>
  <circle cx="444" cy="370" r="6"/>
  <text x="132" y="212" font-size="13">(1) Alice (A,1)</text>
  <text x="293" y="172" font-size="13" fill="#c62828">(3) Alice, Alicia</text>
  <text x="230" y="302" font-size="13">(2) Alicia (B,1)</text>
  <text x="436" y="392" font-size="13" fill="#c62828" text-anchor="end">(3) Alice, Alicia</text>

  <!-- steps 4-6 -->
  <line x1="760" y1="365" x2="770" y2="288" stroke="#777" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#gray)"/>
  <circle cx="520" cy="370" r="6" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="590" cy="370" r="6"/>
  <circle cx="772" cy="280" r="6"/>
  <circle cx="470" cy="190" r="6" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="760" cy="370" r="6"/>
  <circle cx="850" cy="280" r="6"/>
  <text x="600" y="358" font-size="13" fill="#2e7d32">(4) Alice Smith (C,1)</text>
  <text x="754" y="302" font-size="13" text-anchor="end">(5) B learns Alice Smith (C,1)</text>
  <text x="896" y="262" font-size="13" fill="#c62828" text-anchor="end">(6) Alice Johnson (B,2): two siblings</text>

  <text x="10" y="550" font-size="13" fill="#555">Key customer:123; vectors list A, B, C. Blue arrows: client requests; gray dashed arrows: replica sync.</text>
</svg>
