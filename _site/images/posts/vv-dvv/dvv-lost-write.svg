1.4727">Replica B</text></g><g><title>Server A</title><rect fill="#FFFFFF" height="88.1758" style="stroke:#181818;stroke-width:1;" width="10" x="295.0503" y="449.5039"/></g><g><title>Server A</title><rect fill="#FFFFFF" height="101.1309" style="stroke:#181818;stroke-width:1;" width="10" x="295.0503" y="656.2109"/></g><path d="M236,150.4648 L236,172.4648 L534,172.4648 L534,160.4648 L524,150.4648 L236,150.4648" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M524,150.4648 L524,160.4648 L534,160.4648 L524,150.4648" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="225.4355" x="267.8691" y="166.0996">Initially VV = [0,0], D = &#8709; on both replicas</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="743.9346" x="0" y="199.0752"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="743.9346" y1="199.0752" y2="199.0752"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="743.9346" y1="202.0752" y2="202.0752"/><rect fill="#EEEEEE" height="23.3105" style="stroke:#000000;stroke-width:2;" width="205.02" x="269.4573" y="188.4199"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="186.7354" x="275.4573" y="204.9883">Steps 1-2: both clients read</text><g class="message" data-entity-1="part1" data-entity-2="part3" id="msg1"><polygon fill="#181818" points="288.0503,239.041,298.0503,243.041,288.0503,247.041,292.0503,243.041" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="50.3936" x2="294.0503" y1="243.041" y2="243.041"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.6606" x="162.8916" y="238.2988">GET</text></g><g class="message" data-entity-1="part3" data-entity-2="part1" id="msg2"><polygon fill="#181818" points="61.3936,268.3516,51.3936,272.3516,61.3936,276.3516,57.3936,272.3516" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="55.3936" x2="299.0503" y1="272.3516" y2="272.3516"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.042" x="137.7009" y="267.6094">x = 0, ctx {}</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg3"><polygon fill="#181818" points="288.0503,297.6621,298.0503,301.6621,288.0503,305.6621,292.0503,301.6621" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="119.1807" x2="294.0503" y1="301.6621" y2="301.6621"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.6606" x="197.2852" y="296.9199">GET</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg4"><polygon fill="#181818" points="130.1807,326.9727,120.1807,330.9727,130.1807,334.9727,126.1807,330.9727" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="124.1807" x2="299.0503" y1="330.9727" y2="330.9727"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.042" x="172.0945" y="326.2305">x = 0, ctx {}</text></g><path d="M5,343.9727 L5,378.9727 L344,378.9727 L344,353.9727 L334,343.9727 L5,343.9727" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M334,343.9727 L334,353.9727 L344,353.9727 L334,343.9727" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="256.5503" x="41.032" y="359.6074">Algorithm 6.3 has no GET and no context input:</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="257.9521" x="41.032" y="372.5625">what each client saw is never given to the server</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="743.9346" x="0" y="405.5381"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="743.9346" y1="405.5381" y2="405.5381"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="743.9346" y1="408.5381" y2="408.5381"/><rect fill="#EEEEEE" height="23.3105" style="stroke:#000000;stroke-width:2;" width="165.4424" x="289.2461" y="394.8828"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="147.1577" x="295.2461" y="411.4512">Step 3: Client 1 writes</text><g class="message" data-entity-1="part1" data-entity-2="part3" id="msg5"><polygon fill="#181818" points="283.0503,445.5039,293.0503,449.5039,283.0503,453.5039,287.0503,449.5039" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="50.3936" x2="289.0503" y1="449.5039" y2="449.5039"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.8696" x="94.2871" y="444.7617">PUT 10 (ctx {} is ignored)</text></g><path d="M310,462.5039 L310,510.5039 L545,510.5039 L545,472.5039 L535,462.5039 L310,462.5039" fill="#E8F5E9" style="stroke:#181818;stroke-width:0.5;"/><path d="M535,462.5039 L535,472.5039 L545,472.5039 L535,462.5039" fill="#E8F5E9" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="101.7661" x="316" y="478.1387">local: VV_A &#8592; [1,0]</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="131.6938" x="316" y="491.0938">d* = (A,1), D_A &#8592; {(A,1)}</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="214.543" x="316" y="504.0488">&#10003; no siblings existed, assumption holds</text><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg6"><polygon fill="#181818" points="458.7871,533.6797,468.7871,537.6797,458.7871,541.6797,462.7871,537.6797" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="300.0503" x2="464.7871" y1="537.6797" y2="537.6797"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.7368" x="314.5503" y="532.9375">broadcast ([1,0], (A,1))</text></g><path d="M475,550.6797 L475,585.6797 L680,585.6797 L680,560.6797 L670,550.6797 L475,550.6797" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M670,550.6797 L670,560.6797 L680,560.6797 L670,550.6797" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="184.6528" x="481" y="566.3145">new? 1 &#8804; VV_B[A]=0 &#8594; no, so new</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="166.4395" x="481" y="579.2695">D_B = {(A,1)&#8594;10}, VV_B = [1,0]</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="743.9346" x="0" y="612.2451"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="743.9346" y1="612.2451" y2="612.2451"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="743.9346" y1="615.2451" y2="615.2451"/><rect fill="#EEEEEE" height="23.3105" style="stroke:#000000;stroke-width:2;" width="165.4424" x="289.2461" y="601.5898"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="147.1577" x="295.2461" y="618.1582">Step 4: Client 2 writes</text><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg7"><polygon fill="#181818" points="283.0503,652.2109,293.0503,656.2109,283.0503,660.2109,287.0503,656.2109" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="119.1807" x2="289.0503" y1="656.2109" y2="656.2109"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.8696" x="128.6807" y="651.4688">PUT 20 (ctx {} is ignored)</text></g><path d="M310,669.2109 L310,730.2109 L521,730.2109 L521,679.2109 L511,669.2109 L310,669.2109" fill="#FFEBEE" style="stroke:#181818;stroke-width:0.5;"/><path d="M511,669.2109 L511,679.2109 L521,679.2109 L511,669.2109" fill="#FFEBEE" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="101.7661" x="316" y="684.8457">local: VV_A &#8592; [2,0]</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="131.6938" x="316" y="697.8008">d* = (A,2), D_A &#8592; {(A,2)}</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="190.7544" x="316" y="710.7559">&#10007; Client 2 read before (A,1) existed,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="145.3257" x="326.4414" y="723.7109">but 10 is discarded anyway</text><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg8"><polygon fill="#181818" points="458.7871,753.3418,468.7871,757.3418,458.7871,761.3418,462.7871,757.3418" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="300.0503" x2="464.7871" y1="757.3418" y2="757.3418"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.7368" x="314.5503" y="752.5996">broadcast ([2,0], (A,2))</text></g><path d="M475,770.3418 L475,818.3418 L738,818.3418 L738,780.3418 L728,770.3418 L475,770.3418" fill="#FFEBEE" style="stroke:#181818;stroke-width:0.5;"/><path d="M728,770.3418 L728,780.3418 L738,780.3418 L728,770.3418" fill="#FFEBEE" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="184.6528" x="481" y="785.9766">new? 2 &#8804; VV_B[A]=1 &#8594; no, so new</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="242.9346" x="481" y="798.9316">prune (A,1): 1 &#8804; VV_M[A]=2 &#10003; &#8594; 10 removed</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="166.4395" x="481" y="811.8867">D_B = {(A,2)&#8594;20}, VV_B = [2,0]</text><path d="M236,829.207 L236,877.207 L534,877.207 L534,839.207 L524,829.207 L236,829.207" fill="#FFEBEE" style="stroke:#181818;stroke-width:0.5;"/><path d="M524,829.207 L524,839.207 L534,839.207 L524,829.207" fill="#FFEBEE" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="226.4668" x="254.8953" y="844.8418">Result: both replicas hold only {(A,2)&#8594;20}.</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="228.8838" x="254.8953" y="857.7969">Client 1's write is lost: VV_M = [2,0] claims</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="251.3833" x="254.8953" y="870.752">the 20 write "saw" (A,1), but Client 2 never did.</text><path d="M5,888.0723 L5,936.0723 L517,936.0723 L517,898.0723 L507,888.0723 L5,888.0723" fill="#E3F2FD" style="stroke:#181818;stroke-width:0.5;"/><path d="M507,888.0723 L507,898.0723 L517,898.0723 L507,888.0723" fill="#E3F2FD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="325.252" x="84.4238" y="903.707">With the client's context (paper's update(S, S_r, r), DVVS Put):</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="344.4106" x="84.4238" y="916.6621">Put(20, ctx=[0,0]) &#8594; is (A,1) known by ctx? 1 &#8804; 0 &#8594; no, keep 10</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="296.71" x="84.4238" y="929.6172">Result: {(A,1)&#8594;10, (A,2)&#8594;20}, two siblings, nothing lost</text><?plantuml-src bLN1RXit4BtlLmoKGwHYRMZfDaWMK8kLB1Kv6